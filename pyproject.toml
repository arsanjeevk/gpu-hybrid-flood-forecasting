[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-flood-model"
version = "0.1.0"
description = "GPU acceleration of hybrid physics-AI models for real-time urban flood forecasting."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "jax[cuda12]>=0.4.34",
  "flax>=0.9.0",
  "optax>=0.2.3",
  "anuga==3.3.7",
  "geopandas>=1.0.1",
  "rasterio>=1.3.10",
  "shapely>=2.0.5",
  "pyproj>=3.6.1",
  "noise>=1.2.2",
  "pyflwdir>=0.5.9",
  "xarray>=2024.7.0",
  "netCDF4>=1.7.1",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "matplotlib>=3.9.1",
  "cmocean>=4.0.3",
  "plotly>=5.23.0",
  "imageio[ffmpeg]>=2.35.1",
  "hydra-core>=1.3.2",
  "pydantic>=2.8.2",
  "pytest>=8.3.2",
  "pre-commit>=3.8.0",
]

[project.optional-dependencies]
pytorch-bench = [
  "torch>=2.4.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["ruff>=0.5.7", "ipykernel>=6.29.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_flood"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
