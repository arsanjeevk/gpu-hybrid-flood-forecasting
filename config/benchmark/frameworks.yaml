name: matched_residual_unet

# Legacy framework microbenchmark retained for diagnostics. The active research
# comparison is config/comparison/v1_v2_t4.yaml.
require_gpu: true
allow_cpu: false
required_gpu_name: T4

input:
  height: 128
  width: 128
  channels: 6
batch_sizes: [1, 2, 4]
warmup_iterations: 5
measured_iterations: 20

torch:
  compile: true
  compile_mode: default

profiling:
  enabled: true
  batch_size: 1
  iterations: 10

outputs:
  directory: data/outputs/figures
  results_csv: jax_vs_pytorch.csv
  latex_table: jax_vs_pytorch.tex
  metadata: jax_vs_pytorch_metadata.json
  profile_directory: benchmark_profiles
  profile_summary_csv: profile_operations.csv
  figure_base: data/outputs/figures/jax_vs_pytorch_benchmark
  report_directory: report/figures
