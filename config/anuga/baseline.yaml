name: baseline

inputs:
  mesh_elements: data/interim/mesh_elements_epsg32643.gpkg
  boundary_lines: data/interim/boundaries_epsg32643.gpkg
  roughness_lulc: data/interim/roughness_epsg32643.gpkg
  dem: data/synthetic_dem/dem.tif
  rainfall: data/interim/rainfall_clean.parquet

duration_s: 10800.0
# Three-hour development experiment: this covers 8.82% of the 35-hour record,
# integrates 8.35497 mm under the linearly interpolated forcing, and excludes
# the peak at hour 34. Do not label it as a complete return-period event.
yieldstep_s: 10.0
outputstep_s: 60.0
cfl: 0.9
flow_algorithm: DE1
minimum_storable_height_m: 0.001
initial_depth_m: 0.0

boundary:
  # Final documented modelling assumption: all supplied segments and all
  # remaining exterior edges are closed/no-flow boundaries.
  policy: all_reflective_final
  match_tolerance_m: 1.0

rainfall:
  scenario: 45rp_rain
  default_rate_mm_hr: 0.0

outputs:
  run_directory: data/outputs/anuga_runs
  processed_netcdf: data/processed/anuga_baseline.nc
  postprocess_grid_resolution_m: 50.0
  dry_tolerance_m: 0.001
